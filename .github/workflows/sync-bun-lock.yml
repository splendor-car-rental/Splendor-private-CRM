name: Synchronize Bun Lockfile

on:
  push:
    branches:
      - hardening/production-100

permissions:
  contents: write

concurrency:
  group: bun-lock-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Synchronize bun.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: hardening/production-100
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Regenerate lockfile from package.json
        run: bun install --lockfile-only

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: synchronize bun lockfile"
          git push origin HEAD:hardening/production-100
