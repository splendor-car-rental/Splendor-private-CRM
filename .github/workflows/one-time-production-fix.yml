name: One-time production integration fix
on:
  push:
    branches: ['integration/production-final']
permissions:
  contents: write
jobs:
  fix:
    if: github.actor == 'splendor-car-rental'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: print('already fixed:', path); return
              p.write_text(s.replace(old,new,1)); print('patched:', path)
          replace('src/context/CRMContext.tsx',
              'reconcileBankTransaction: (txnId: string, targetRecordType: string, targetRecordId: string) => Promise<void>;',
              'reconcileBankTransaction: (txnId: string, targetRecordType: string, targetRecordId: string, classification?: any, duplicateOverrideReason?: string) => Promise<void>;\n  reclassifyBankTransaction: (txnId: string, classification: any, reason: string) => Promise<void>;\n  previewBankImport: (file: any) => Promise<any>;\n  confirmBankImport: (file: any) => Promise<any>;\n  startVehicleMaintenance: (vehicleId: string, reason: string) => Promise<any>;\n  logVehicleMaintenance: (vehicleId: string, mileageAtService: number, notes: string) => Promise<any>;')
          p=Path('src/types/compatibility.d.ts'); s=p.read_text()
          for old,new in [
            ("export type KycStatus = 'pending' | 'in_progress' | 'verified' | 'rejected' | 'expired' | 'PENDING' | 'UNDER_REVIEW' | 'DOCUMENTS_PENDING' | 'VERIFIED' | 'EXPIRED' | 'REJECTED' | 'UNVERIFIED' | 'ACCEPTED';", 'export type KycStatus = string;'),
            ("export type CustomerKycCategory = 'identity' | 'driving_license' | 'address' | 'corporate' | 'other' | 'UAE_RESIDENT' | 'TOURIST' | 'GCC_NATIONAL';", 'export type CustomerKycCategory = string;'),
            ('export type DocumentCategory = CustomerKycCategory | \'passport\' | \'emirates_id\' | \'driving_license\' | \'proof_of_address\' | \'company\' | \'other\' | string;', 'export type DocumentCategory = string;'),
            ('export interface KycDocument { id: string; category: CustomerKycCategory | string;', 'export interface KycDocument { id: string; category: string;'),
            ('customerName?: string; contractId?: string;', 'vehicleId?: string; customerName?: string; vehicleName?: string; contractId?: string;'),
            ('documentNumberRaw?: string;', 'documentNumberRaw?: string;'),
            ('isAgeVerified?: boolean;', 'isAgeVerified?: boolean; updatedAt?: string;'),
            ('type: string; title?: string; severity?', 'type: string; title?: string; titleAr?: string; severity?'),
            ('referenceNumber?: string; violationDate?: string; ticketNumber?', 'referenceNumber?: string; violationDate?: string; violationTime?: string; ticketNumber?'),
            ('seasonalityApplied?: any; breakdown?', 'seasonalityApplied?: any; occupancyPercent?: number; breakdown?')
          ]:
            if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          replace('src/lib/upload.ts', 'extra?: { targetUserId?: string; customerId?: string; inspectionId?: string; paymentId?: string; bankBatchId?: string }', 'extra?: { targetUserId?: string; customerId?: string; inspectionId?: string; paymentId?: string; bankBatchId?: string }')
          PY
      - name: Remove temporary augmentation and commit
        shell: bash
        run: |
          git config user.name 'splendor-car-rental'
          git config user.email 'ahmedmorsy724@gmail.com'
          git rm -f .github/workflows/one-time-production-fix.yml
          git add src/context/CRMContext.tsx src/types/compatibility.d.ts src/lib/upload.ts
          git commit -m 'fix: align CRM context and engine compatibility models' || true
          git push origin HEAD:integration/production-final
