# This workflow must never mutate or push repository source again.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain retired workflow
        run: |
          echo "RETIRED: this workflow is retained only as a historical marker."
          echo "It has read-only permissions and performs no checkout, patch, commit, or push."
