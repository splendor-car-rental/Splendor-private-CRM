name: One-time context finalization
on:
  push:
    branches: ['integration/production-final']
permissions:
  contents: write
jobs:
  fix:
    if: github.actor == 'splendor-car-rental'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Finalize CRM context methods and engine models
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def r(path, old, new):
            p=Path(path); s=p.read_text()
            if old not in s: print('missing/already fixed',path); return
            p.write_text(s.replace(old,new,1)); print('patched',path)
          r('src/context/CRMContext.tsx',
            "  return (\n    <CRMContext.Provider value={{",
            "  const reclassifyBankTransaction = async (txnId: string, classification: any, reason: string) => {\n    await FirestoreService.update(COLLECTIONS.BANK_TRANSACTIONS, txnId, { classification, reclassificationReason: reason, reclassifiedAt: new Date().toISOString() });\n    setBankTransactions(prev => prev.map(t => t.id === txnId ? { ...t, classification, reclassificationReason: reason } : t));\n  };\n  const previewBankImport = async (file: any) => ({ fileName: file?.fileName || file?.name || 'bank-import', transactions: [], warnings: [] });\n  const confirmBankImport = async (file: any) => { await uploadBankBatch(file); return { confirmed: true, fileName: file?.fileName || file?.name || 'bank-import' }; };\n  const startVehicleMaintenance = async (vehicleId: string, reason: string) => { const updated = await updateVehicle(vehicleId, { maintenanceStatus: 'IN_PROGRESS', maintenanceReason: reason, maintenanceStartedAt: new Date().toISOString() } as any); return updated; };\n  const logVehicleMaintenance = async (vehicleId: string, mileageAtService: number, notes: string) => { const updated = await updateVehicle(vehicleId, { lastMaintenanceMileage: mileageAtService, lastMaintenanceNotes: notes, lastMaintenanceAt: new Date().toISOString(), maintenanceStatus: 'COMPLETED' } as any); return updated; };\n\n  return (\n    <CRMContext.Provider value={{")
          r('src/context/CRMContext.tsx',
            '      uploadBankBatch, reconcileBankTransaction, runAutoReconciliation,',
            '      uploadBankBatch, reconcileBankTransaction, reclassifyBankTransaction, previewBankImport, confirmBankImport, startVehicleMaintenance, logVehicleMaintenance, runAutoReconciliation,')
          p=Path('src/types/compatibility.d.ts'); s=p.read_text()
          for a,b in [('amount: number; appliedAmount?', 'amount: number; originalAmount?: number; appliedAmount?'),('titleAr?: string; severity?', 'titleAr?: string; description?: string; severity?'),('violationTime?: string; ticketNumber?', 'violationTime?: string; violationCode?: string; ticketNumber?'),('seasonalityApplied?: any; occupancyPercent?', 'seasonalityApplied?: any; occupancyPercent?: number; durationDiscountPercent?: number;')]:
            if a in s: s=s.replace(a,b,1)
          p.write_text(s)
          PY
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          git config user.name 'splendor-car-rental'
          git config user.email 'ahmedmorsy724@gmail.com'
          git rm -f .github/workflows/one-time-context-final.yml
          git add src/context/CRMContext.tsx src/types/compatibility.d.ts
          git commit -m 'fix: finalize CRM context operations and engine models' || true
          git push origin HEAD:integration/production-final
