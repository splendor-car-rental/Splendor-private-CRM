name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Set up JDK 21 for the Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Verify Java is available for the Firestore emulator
        run: java -version
      - name: Typecheck
        run: bun run lint
      - name: Run full test suite (unit + integration + Firestore rules + security)
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Verify build output, approved assets, and Vercel API entrypoint
        run: |
          test -s dist/server.cjs
          test -s api-handler.cjs
          test -s dist/index.html
          test -d dist/approved-forms
          test -s dist/assets/approved/splendor-official-seal.svg
          test "$(find dist/approved-forms -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 16
          VERCEL=1 node -e "const m=require('./api-handler.cjs'); const h=m.default||m; if(typeof h!=='function') throw new Error('Bundled Vercel API handler did not export a function');"
          VERCEL=1 bun -e "import('./api/index.ts').then(m=>{if(typeof m.default!=='function') throw new Error('Vercel API entrypoint did not resolve generated bundle')})"
