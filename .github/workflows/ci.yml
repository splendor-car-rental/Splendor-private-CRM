name: CI

# Production validation gate. Every push and PR must pass typecheck,
# the full test suite (including Firestore emulator/rules/security tests),
# and the production build before it is considered mergeable.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # bun.lock is lockfileVersion 2. Bun 1.3.x cannot parse that format;
      # Bun 1.4.x is the writer/reader for this lockfile generation.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Set up JDK 21 for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java is available for the Firestore emulator
        run: java -version

      - name: Typecheck
        run: npm run lint

      - name: Run full test suite (unit + integration + Firestore rules + security)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify build output exists
        run: |
          test -s dist/server.cjs
          test -s dist/index.html
