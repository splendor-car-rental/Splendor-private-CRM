name: CI

# Production validation gate (Phase 16 of the production remediation pass).
# Every push and PR must pass ALL of these before it's considered
# mergeable/deployable -- typecheck, the full test suite (unit +
# integration + Firestore rules + security/authorization/idempotency
# regression tests, all running against a REAL Firestore emulator, not
# mocks), and the actual production build. A red step here is a real
# failure, not a flaky/cosmetic one to click past: nothing in this repo's
# test suite is skipped, quarantined, or soft-failed.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# A new push to the same branch/PR cancels the previous run -- no point
# finishing a validation of a commit that's already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node version is pinned in .nvmrc / package.json "engines" (Phase 17)
      # so CI, local dev, and Vercel's build all resolve the exact same
      # major version rather than drifting independently.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # bun.lock is this repo's actual lockfile (see package.json -- Vercel
      # auto-detects Bun as the package manager from its presence).
      # --frozen-lockfile fails the build outright if package.json and
      # bun.lock have drifted out of sync, instead of silently re-resolving
      # a different dependency tree than what's committed.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # Firestore emulator (java -jar) is what `npm test` shells out to via
      # firebase-tools. ubuntu-latest's default JRE (17) is too old --
      # firebase-tools requires JDK 21+ and fails outright with "firebase-
      # tools no longer supports Java version before 21" otherwise, which
      # is exactly what the first version of this workflow hit.
      - name: Set up JDK 21 for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java is available for the Firestore emulator
        run: java -version

      - name: Typecheck
        run: npm run lint

      - name: Run full test suite (unit + integration + Firestore rules + security)
        run: npm test

      - name: Production build
        run: npm run build

      # Fails the job if the build produced something other than what the
      # runtime actually loads -- a cheap, fast sanity check that catches a
      # build silently producing an empty/broken bundle.
      - name: Verify build output exists
        run: |
          test -s dist/server.cjs
          test -s dist/index.html
