name: PR9 type contract repair

on:
  push:
    branches: [integration/production-final]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Repair merged type contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          types = Path('src/types/index.ts')
          text = types.read_text()

          def remove_decl(src, kind, name):
              pattern = rf'(?ms)^export {kind} {name}[^\\n]*\\n(?:.*?\\n?)?(?=^export (?:type|interface|const|function|class) |\\Z)'
              m = re.search(pattern, src)
              if not m:
                  return src
              # Only remove declarations from the later duplicated governance block.
              positions = [x.start() for x in re.finditer(pattern, src)]
              if len(positions) < 2:
                  return src
              return src[:positions[-1]] + src[m.end():]

          # Remove the later duplicate declarations that conflict with the established CRM contracts.
          for kind, name in [
              ('type', 'KycStatus'), ('type', 'DocumentCategory'), ('type', 'CustomerKycCategory'),
              ('interface', 'KycDocument'), ('interface', 'CustomerKycProfile'), ('interface', 'CustomerUploadedDoc'),
              ('interface', 'CompanyBankAccount'), ('type', 'DepositLifecycleStatus'),
              ('type', 'FineStatus'), ('type', 'FineSource'), ('interface', 'TrafficFine'),
              ('interface', 'TelematicsPing'), ('interface', 'TelematicsAlert'), ('interface', 'GeofenceZone'),
              ('interface', 'SeasonalityRule'), ('interface', 'OccupancyMultiplierRule'),
              ('interface', 'YieldPricingQuoteResult'),
          ]:
              text = remove_decl(text, kind, name)

          replacements = {
              "export type KycStatus = 'pending' | 'under_review' | 'verified' | 'rejected' | 'expired';":
              "export type KycStatus = 'pending' | 'under_review' | 'verified' | 'rejected' | 'expired' | 'PENDING' | 'UNDER_REVIEW' | 'VERIFIED' | 'REJECTED' | 'EXPIRED' | 'DOCUMENTS_PENDING' | 'UNVERIFIED' | 'ACCEPTED';",
              "export type DocumentCategory = 'id' | 'driving_license' | 'residence_proof' | 'employment' | 'financial' | 'other';":
              "export type DocumentCategory = 'id' | 'driving_license' | 'residence_proof' | 'employment' | 'financial' | 'other' | 'EMIRATES_ID_FRONT' | 'EMIRATES_ID_BACK' | 'PASSPORT' | 'VISA_ENTRY_STAMP' | 'DRIVING_LICENSE_FRONT' | 'DRIVING_LICENSE_BACK';",
              "export type CustomerKycCategory = 'tier_1' | 'tier_2' | 'tier_3' | 'vip' | 'corporate';":
              "export type CustomerKycCategory = 'tier_1' | 'tier_2' | 'tier_3' | 'vip' | 'corporate' | 'TOURIST' | 'UAE_RESIDENT' | 'GCC_NATIONAL';",
              "export type DepositLifecycleStatus = 'collected' | 'held' | 'released' | 'forfeited' | 'disputed';":
              "export type DepositLifecycleStatus = 'collected' | 'held' | 'released' | 'forfeited' | 'disputed' | 'pending' | 'applied' | 'partially_refunded' | 'refunded' | 'cancelled' | 'HELD_ACTIVE' | 'POST_RENTAL_HOLD' | 'FULLY_DEDUCTED' | 'PARTIALLY_DEDUCTED' | 'RELEASED_REFUNDED';",
              "export type FineStatus = 'issued' | 'received' | 'paid' | 'disputed' | 'waived' | 'pending_payment';":
              "export type FineStatus = 'issued' | 'received' | 'paid' | 'disputed' | 'waived' | 'pending_payment' | 'pending' | 'approved' | 'billed' | 'cancelled' | 'unallocated' | 'allocated_to_contract';",
              "export type FineSource = 'salik' | 'rta' | 'manual' | 'imported';":
              "export type FineSource = 'salik' | 'rta' | 'manual' | 'imported' | 'police' | 'import' | 'other' | 'dubai_police';",
              "export type PaymentMethod = 'cash' | 'bank_transfer' | 'card' | 'online_link' | 'corporate_credit';":
              "export type PaymentMethod = 'cash' | 'bank_transfer' | 'card' | 'online_link' | 'corporate_credit' | 'pos_card' | 'cheque' | 'other';",
              "export type ApprovalRequestType = 'rule_change';":
              "export type ApprovalRequestType = 'rule_change' | 'lto_application' | 'lto_settlement' | 'lto_termination' | 'vehicle_catalog_update';",
              "action: 'CREATED' | 'PURCHASED' | 'REGISTERED' | 'PLATE_ASSIGNED' | 'PLATE_TRANSFERRED' | 'RENTAL_STARTED' | 'RENTAL_COMPLETED' | 'MAINTENANCE_LOGGED' | 'PUBLISHED_TO_WEB' | 'UNPUBLISHED_FROM_WEB' | 'FEATURED_ON_WEB' | 'PRICING_UPDATED' | 'SOLD' | 'ARCHIVED' | 'RESTORED';":
              "action: 'CREATED' | 'PURCHASED' | 'REGISTERED' | 'PLATE_ASSIGNED' | 'PLATE_TRANSFERRED' | 'RENTAL_STARTED' | 'RENTAL_COMPLETED' | 'MAINTENANCE_LOGGED' | 'MAINTENANCE_STARTED' | 'PUBLISHED_TO_WEB' | 'UNPUBLISHED_FROM_WEB' | 'FEATURED_ON_WEB' | 'PRICING_UPDATED' | 'SOLD' | 'ARCHIVED' | 'RESTORED';",
              "action: 'create' | 'update' | 'delete' | 'status_change' | 'approval' | 'refund' | 'reconcile' | 'merge' | 'rule_change' | 'kill_switch' | 'approval_decision';":
              "action: 'create' | 'update' | 'delete' | 'status_change' | 'approval' | 'refund' | 'reconcile' | 'merge' | 'rule_change' | 'kill_switch' | 'approval_decision' | 'reclassify' | 'lto_application' | 'lto_settlement' | 'lto_termination' | 'vehicle_catalog_update';",
              "fuelType: 'petrol' | 'electric' | 'hybrid';":
              "fuelType: 'petrol' | 'electric' | 'hybrid' | 'diesel' | 'phev' | 'hydrogen';",
          }
          for old, new in replacements.items():
              text = text.replace(old, new, 1)

          # Add the missing feature contracts as interfaces/types consumed by PR9.
          additions = r'''

// ---------------------------------------------------------------------------
// PR9 feature contracts: explicit shared domain types for newly integrated
// modules. These are intentionally kept in the shared type boundary rather
// than weakening callers with `any` or suppression directives.
// ---------------------------------------------------------------------------
export type VehicleManufacturer = string;
export interface VehicleCatalogModel { id: string; manufacturer: string; model: string; year?: number; trim?: string; active?: boolean; [key: string]: unknown; }
export type VehicleBodyStyle = 'sedan' | 'suv' | 'coupe' | 'convertible' | 'hatchback' | 'wagon' | 'pickup' | 'van' | string;
export type VehicleClassTier = 'economy' | 'standard' | 'premium' | 'luxury' | 'exotic' | 'supercar' | string;
export type VehicleSuvClass = 'compact' | 'midsize' | 'fullsize' | 'luxury' | string;
export type VehiclePerformanceClass = 'standard' | 'sport' | 'performance' | 'supercar' | 'hypercar' | string;
export type VehicleRentalSegment = 'economy' | 'compact' | 'suv' | 'luxury' | 'premium' | 'exotic' | 'supercar' | string;
export type VehicleUsageType = 'rental' | 'lease_to_own' | 'company' | 'fleet' | 'demo' | string;
export type VehicleDrivetrain = 'fwd' | 'rwd' | 'awd' | '4wd' | string;
export type VehicleRoofType = 'standard' | 'sunroof' | 'panoramic' | 'convertible' | 'hardtop' | string;

export type BankMatchClassification = 'exact' | 'probable' | 'possible' | 'manual_review' | 'unmatched' | string;
export interface UnmatchedCrmPaymentReportEntry { paymentId: string; amount: number; reference?: string; customerId?: string; customerName?: string; reason?: string; }

export interface LtoApplication { id: string; customerId: string; vehicleId: string; contractId?: string; status: LtoApplicationStatus; requestedAmount?: number; createdAt: string; updatedAt: string; [key: string]: unknown; }
export type LtoApplicationStatus = 'draft' | 'pending' | 'under_review' | 'approved' | 'rejected' | 'active' | 'completed' | 'cancelled' | string;
export interface LtoEligibilityCheck { eligible: boolean; reasons?: string[]; score?: number; [key: string]: unknown; }
export interface LtoFinancialOffer { id?: string; vehiclePrice?: number; downPayment?: number; financedAmount?: number; monthlyPayment?: number; termMonths?: number; [key: string]: unknown; }
export interface LtoContractDetails { applicationId?: string; termMonths?: number; downPayment?: number; monthlyPayment?: number; totalPayable?: number; [key: string]: unknown; }
export type LtoStatus = 'draft' | 'pending' | 'approved' | 'active' | 'completed' | 'settled' | 'terminated' | string;
export interface LtoInstallment { id: string; applicationId?: string; contractId?: string; amount: number; dueDate: string; paidAt?: string; status: LtoInstallmentStatus; [key: string]: unknown; }
export type LtoInstallmentStatus = 'pending' | 'paid' | 'overdue' | 'waived' | 'cancelled' | string;
export interface LtoSettlementRequest { id: string; applicationId?: string; contractId?: string; amount: number; reason?: string; status?: string; createdAt?: string; [key: string]: unknown; }

export interface BlocklistEntry { id: string; identifier: string; identifierType: BlocklistIdentifierType; tier: BlocklistTier; reason?: string; active?: boolean; customerId?: string; createdAt?: string; updatedAt?: string; [key: string]: unknown; }
export type BlocklistIdentifierType = 'customer' | 'phone' | 'email' | 'id_number' | 'passport' | 'license' | string;
export type BlocklistTier = 'low' | 'medium' | 'high' | 'critical' | string;

export interface VehicleInspection { id: string; vehicleId: string; contractId?: string; type: InspectionType; photos?: InspectionPhoto[]; damages?: InspectionDamageMarker[]; notes?: string; createdAt?: string; updatedAt?: string; [key: string]: unknown; }
export type InspectionType = 'receiving' | 'handover' | 'return' | 'periodic' | string;
export type InspectionPhotoCategory = 'exterior' | 'interior' | 'damage' | 'odometer' | 'fuel' | 'documents' | string;
export interface InspectionDamageMarker { id: string; category?: string; severity?: string; description?: string; [key: string]: unknown; }
export interface InspectionPhoto { id: string; url: string; category: InspectionPhotoCategory; caption?: string; [key: string]: unknown; }
export type DamageClassification = 'minor' | 'moderate' | 'major' | 'total_loss' | string;
export type DamageLiabilityStatus = 'customer' | 'supplier' | 'splendor' | 'insurance' | 'undetermined' | string;

export interface WhatsAppConversation { id: string; customerId?: string; customerName?: string; phone?: string; state: WhatsAppConversationState; priority: WhatsAppConversationPriority; messages?: WhatsAppConversationMessage[]; [key: string]: unknown; }
export type WhatsAppConversationState = 'open' | 'pending' | 'resolved' | 'closed' | string;
export interface WhatsAppConversationMessage { id: string; conversationId?: string; direction?: 'inbound' | 'outbound' | string; body?: string; text?: string; timestamp?: string; [key: string]: unknown; }
export type WhatsAppConversationPriority = 'low' | 'normal' | 'high' | 'urgent' | string;
export interface WhatsAppConversationDraft { conversationId?: string; body?: string; text?: string; [key: string]: unknown; }
export type WhatsAppCustomerMatchStatus = 'matched' | 'unmatched' | 'ambiguous' | string;
export interface WhatsAppReservationRequest { id?: string; customerId?: string; conversationId?: string; vehicleId?: string; pickupDateTime?: string; returnDateTime?: string; [key: string]: unknown; }

export type PaymentGatewayProvider = 'tabby' | 'stripe' | 'network' | 'manual' | string;
export type PaymentIntentPurpose = 'rental' | 'deposit' | 'invoice' | 'lto_installment' | 'other' | string;
export type PaymentIntentStatus = 'created' | 'requires_action' | 'processing' | 'succeeded' | 'failed' | 'cancelled' | string;
export type PaymentGatewayEventType = 'payment_succeeded' | 'payment_failed' | 'refund_succeeded' | 'refund_failed' | string;
export interface PaymentIntent { id: string; customerId?: string; amount: number; currency?: string; purpose: PaymentIntentPurpose; status: PaymentIntentStatus; provider?: PaymentGatewayProvider; idempotencyKey?: string; createdAt?: string; updatedAt?: string; [key: string]: unknown; }
export interface PaymentGatewayEvent { id: string; type: PaymentGatewayEventType; paymentIntentId?: string; payload?: Record<string, unknown>; createdAt?: string; [key: string]: unknown; }
export interface PaymentRefund { id: string; paymentIntentId?: string; amount: number; status?: string; reason?: string; createdAt?: string; [key: string]: unknown; }

export interface VehicleCatalogUpdateRequest { id?: string; vehicleId?: string; manufacturer?: string; model?: string; status?: VehicleCatalogRequestStatus; [key: string]: unknown; }
export type VehicleCatalogRequestStatus = 'pending' | 'approved' | 'rejected' | 'applied' | string;
'''
          text += additions

          # Merge optional fields used by the current UI/server into existing interfaces.
          def add_props(interface_name, props):
              nonlocal text
              pattern = rf'(?ms)(export interface {interface_name} \\{{)(.*?)^\\}}'
              m = re.search(pattern, text)
              if not m:
                  return
              body = m.group(2)
              missing = ''.join(f'  {p}\\n' for p in props if p.split(':',1)[0].strip() not in body)
              text = text[:m.start(2)] + body + missing + text[m.end(2):]

          add_props('Contract', [
              "contractType?: 'rental' | 'lease_to_own' | string;",
              'lto?: LtoContractDetails;'
          ])
          add_props('Vehicle', [
              'countryOfOrigin?: string;', 'bodyStyle?: VehicleBodyStyle;', 'vehicleClassTier?: VehicleClassTier;',
              'suvClass?: VehicleSuvClass;', 'performanceClass?: VehiclePerformanceClass;', 'rentalSegment?: VehicleRentalSegment;',
              'usageTypes?: VehicleUsageType[];', 'drivetrain?: VehicleDrivetrain;', 'doors?: number;', 'seats?: number;',
              'roofType?: VehicleRoofType;', 'ltoStatus?: LtoStatus;'
          ])
          add_props('Quotation', [
              'discountApprovalId?: string;', 'discountOverridePending?: boolean;', 'requestedDiscountAmount?: number;',
              'requestedDiscountPercentage?: number;'
          ])
          add_props('Payment', ['verificationStatus?: string;', 'verificationNote?: string;'])
          add_props('AuditLog', ['contentHash?: string;'])
          add_props('BankTransaction', [
              'matchClassification?: BankMatchClassification;', 'matchReason?: string;', 'matchReasonAr?: string;',
              'receivedAmountClassification?: ReceivedAmountClassification;'
          ])
          add_props('BankImportBatch', ['unmatchedCrmPayments?: UnmatchedCrmPaymentReportEntry[];'])
          add_props('Deposit', ['holdType?: string;'])

          types.write_text(text)

          compat = Path('src/types/compatibility.d.ts')
          compat.write_text('''import type { VehicleTimelineEvent as _VehicleTimelineEvent } from './index';\n\ndeclare module './index' {\n  export interface KycDocument { customerId?: string; documentNumberRaw?: string; documentCategory?: DocumentCategory; fileType?: string; storagePath?: string; documentNumber?: string; documentNumberMasked?: string; issuingCountry?: string; status?: KycStatus; verifiedByName?: string; rejectionReason?: string; notes?: string; }\n  export interface CustomerKycProfile { status: KycStatus; customerId?: string; customerCategory?: CustomerKycCategory; documents: KycDocument[]; lastReviewedAt?: string; lastReviewedBy?: string; rejectionReason?: string; rejectionNotes?: string; notes?: string; riskScore?: unknown; isAgeVerified?: boolean; updatedAt?: string; ceoExceptionGranted?: boolean; age?: unknown; }\n  export interface CustomerUploadedDoc extends KycDocument {}\n  export interface Customer { kyc?: CustomerKycProfile; uploadedDocuments?: CustomerUploadedDoc[]; }\n  export interface CompanyBankAccount { bankNameAr?: string; accountNameAr?: string; swiftBic?: string; branch?: string; openingBalance?: number; status?: string; isPrimary?: boolean; notes?: string; }\n  export interface SecurityDepositRecord { vehicleId?: string; customerName?: string; vehicleName?: string; originalAmount?: number; preAuthRef?: string; preAuthExpiry?: string; collectedAt?: string; appliedAmount?: number; refundedAmount?: number; balance?: number; currentBalance?: number; totalDeductions?: number; deductions?: unknown[]; paymentMethod?: string; holdReleaseDueDate?: string; holdReleaseEligibleDate?: string; appliedReason?: string; refundDate?: string; returnDate?: string; releasedAt?: string; releasedBy?: string; transactionRef?: string; auditHistory?: unknown[]; notes?: string; }\n  export interface TelematicsPing { speedKmh?: number; mileage?: number; ignition?: boolean; metadata?: Record<string, unknown>; }\n  export interface TelematicsAlert { contractId?: string; customerId?: string; title?: string; titleAr?: string; description?: string; speedKmh?: number; latitude?: number; longitude?: number; severity?: 'critical' | string; message?: string; resolved?: boolean; resolvedAt?: string; resolvedBy?: string; metadata?: Record<string, unknown>; }\n  export interface GeofenceZone { nameAr?: string; description?: string; latitude?: number; longitude?: number; radiusMeters?: number; isRestricted?: boolean; coordinates?: Array<{ lat: number; lng: number }>; zoneType?: string; penaltyAmountAed?: number; active?: boolean; polygon?: Array<{ lat: number; lng: number }>; }\n  export interface SeasonalityRule { name?: string; nameAr?: string; multiplier?: number; active?: boolean; priority?: number; applicableCategories?: string[]; baseDailyRate?: number; minRentalDays?: number; }\n  export interface OccupancyMultiplierRule { minOccupancy?: number; maxOccupancy?: number; minOccupancyPercent?: number; maxOccupancyPercent?: number; active?: boolean; priority?: number; }\n  export interface YieldPricingQuoteResult { dailyRate?: number; baseDailyRate?: number; weeklyRate?: number; monthlyRate?: number; currency?: string; durationDays?: number; totalDays?: number; seasonalityApplied?: unknown; occupancyPercent?: number; durationDiscountPercent?: number; finalDailyRate?: number; subtotal?: number; vatAmount?: number; grandTotal?: number; suggestedDeposit?: number; calculationBreakdown?: string[]; }\n  export interface VehicleTimelineEvent { action: _VehicleTimelineEvent['action']; }\n}\n''')

      - name: Commit repaired contracts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/index.ts src/types/compatibility.d.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: reconcile PR9 shared type contracts"
          git push origin HEAD:integration/production-final
          rm -f .github/workflows/pr9-type-repair.yml
          git add .github/workflows/pr9-type-repair.yml
          git commit -m "chore: remove one-time PR9 repair workflow"
          git push origin HEAD:integration/production-final
